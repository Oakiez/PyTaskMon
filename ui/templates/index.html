<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PyTaskMon</title>
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}?v=2">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16.png') }}?v=2">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}?v=2">
  <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1 class="logo"><span>Py</span>TaskMon</h1>
    <span id="platform-badge" class="badge" hidden></span>
    <div id="summary">กำลังโหลด…</div>
    <span id="status"></span>
  </header>

  <section class="charts">
    <div class="chart-box">
      <div class="chart-title">CPU รวม <span id="cpu-now"></span></div>
      <canvas id="cpu-chart" width="400" height="90"></canvas>
    </div>
    <div class="chart-box">
      <div class="chart-title">RAM รวม <span id="ram-now"></span></div>
      <canvas id="ram-chart" width="400" height="90"></canvas>
    </div>
  </section>

  <div class="toolbar">
    <input id="search" type="search" placeholder="ค้นหาชื่อหรือ PID">

    <div class="state-filter" id="state-filter-group">
      <button type="button" class="filter-btn active" data-state="">All</button>
      <button type="button" class="filter-btn" data-state="running">running</button>
      <button type="button" class="filter-btn" data-state="sleeping">sleeping</button>
      <button type="button" class="filter-btn" data-state="stopped">stopped</button>
      <button type="button" class="filter-btn" data-state="zombie">zombie</button>
    </div>
    <!-- app.js ยังอ่านค่าจาก select นี้ จึงเก็บไว้แบบซ่อน ปุ่มด้านบนเป็นตัวสั่งเปลี่ยนค่า -->
    <select id="state-filter" hidden>
      <option value="">ทุก state</option>
      <option value="running">running</option>
      <option value="sleeping">sleeping</option>
      <option value="disk_sleep">disk_sleep</option>
      <option value="stopped">stopped</option>
      <option value="zombie">zombie</option>
      <option value="idle">idle</option>
      <option value="unknown">unknown</option>
    </select>

    <div class="tree-controls">
      <span id="tree-hint"></span>
      <label><input type="checkbox" id="tree-toggle"> แสดงเป็นต้นไม้</label>
      <button id="expand-all" type="button">ขยายทั้งหมด</button>
      <button id="collapse-all" type="button">ยุบทั้งหมด</button>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th data-key="pid">PID</th>
          <th data-key="name">ชื่อ</th>
          <th data-key="ppid">PPID</th>
          <th data-key="state">State</th>
          <th data-key="priority">Priority</th>
          <th data-key="cpu_percent">CPU %</th>
          <th data-key="mem_rss">RAM (MB)</th>
          <th data-key="threads">Threads</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div id="toast" hidden></div>

  <dialog id="confirm-dialog">
    <p id="confirm-text"></p>
    <form method="dialog">
      <button value="cancel">ยกเลิก</button>
      <button value="ok">ยืนยัน</button>
    </form>
  </dialog>

  <script>
    // ผูกปุ่มกรอง state กับ <select id="state-filter"> เดิม (app.js ฟัง event "change" ของ select)
    (function () {
      var group = document.getElementById("state-filter-group");
      var select = document.getElementById("state-filter");
      group.addEventListener("click", function (e) {
        var btn = e.target.closest(".filter-btn");
        if (!btn) return;
        group.querySelectorAll(".filter-btn").forEach(function (b) {
          b.classList.toggle("active", b === btn);
        });
        select.value = btn.dataset.state;
        select.dispatchEvent(new Event("change"));
      });
    })();
  </script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
